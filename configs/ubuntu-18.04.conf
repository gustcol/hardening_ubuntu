# Ubuntu Hardening Suite - Ubuntu 18.04 (Bionic) Specific Configuration

# Version-specific settings
UBUNTU_VERSION="18.04"
UBUNTU_CODENAME="bionic"

# Package settings
TIME_SYNC_SERVICE="systemd-timesyncd"
AUDITD_PACKAGE="auditd"
APACHE_VERSION="2.4"
PHP_VERSION="7.2"

# Service names
SSH_SERVICE="ssh"
FIREWALL_SERVICE="ufw"

# File paths
SSHD_CONFIG="/etc/ssh/sshd_config"
UFW_CONFIG="/etc/default/ufw"
AUDITD_CONFIG="/etc/audit/auditd.conf"

# Security settings specific to 18.04
ENABLE_APPARMOR_FULL=true
ENABLE_LIVEPATCH=true
ENABLE_ESM=true

# Kernel parameters
KERNEL_VERSION="4.15"
ENABLE_BPF=false
ENABLE_CGROUP_V2=false

# Network settings
NETPLAN_CONFIG="/etc/netplan/01-netcfg.yaml"
NETWORK_BACKEND="systemd-networkd"

# Cloud-init settings
CLOUD_INIT_VERSION="18.5"
ENABLE_CLOUD_INIT=true
